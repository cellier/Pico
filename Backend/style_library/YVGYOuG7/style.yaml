Spacing:
Outer Margin: Extra Large
Inner Padding: Spacious

Text Density: >-
  Medium

Image Ratio:
Documentation: >-
  Approximately 60–75%

Photography & Graphics: >-
  Approximately 25–40%

Visual Rhythm:
- Cover
- Table of contents
- Brand philosophy
- Logo system
- Logo variations
- Incorrect usage
- Typography
- Color palette
- Illustration style
- Grid system
- Applications
- Closing

Overall Impression: >
  A beautifully organized CI manual
  in the vein of the brand guidelines produced by Pentagram and Collins.
  A strict Swiss grid,
  generous whitespace,
  a minimal layout accented by the brand color,
  and logo specs, palettes, typography, iconography, and grid systems
  organized into a consistent design system —
  composing a refined editorial design
  that reads like a corporate brand book.
