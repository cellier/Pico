Design Style:
Name: "Brand Guideline"

Concept: >
  Pentagram、
  Manual Creative、
  Collins、
  Wolff Olins、
  Base Design、
  Swiss International Style、
  Corporate Identity Manual、
  Brand Guideline、
  Modern Design System、
  and the Graphic Standards Manual —
  a brand-guideline editorial design.

  Slides are composed not as generic presentation material
  but as brand guidelines,
  CI manuals,
  design systems,
  and corporate brand books.

