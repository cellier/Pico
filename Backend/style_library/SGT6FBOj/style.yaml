Design Style:
Name: "Swiss"

Concept: >
  A data-driven editorial design inspired by
  Swiss Modernism,
  information design,
  scientific reference books, timetables,
  archival materials, and experimental posters.

  Information is rebuilt not as mere explanation
  but as a "visual construct."

  Numbers, diagrams, symbols, and typography
  are placed geometrically,
  producing a worldview where intellect and playfulness coexist.

Canvas:
Ratio: "16:9"

Mood:
- Intelligent
- Analytical
- Experimental
- Precise
- Editorial
- Contemporary
- Optimistic
- Systematic

Temperature:
Overall: Cool

Color Palette:
Background:
PaperWhite: "#F8F7F3"

Primary:
AccentPink: "#FF4FC3"
AcidYellow: "#E7FF38"
CyanBlue: "#72D7FF"

Secondary:
Black: "#111111"

Accent:
LightGray: "#DADADA"
White: "#FFFFFF"

Typography:
Headlines:
Style: >
  Swiss-grotesque sans-serif.

  An inorganic, functional impression
  reminiscent of Helvetica, Univers,
  and Akzidenz-Grotesk.

  Letterforms are treated as shapes in themselves.

Weight: 700-900
Case: Uppercase preferred
Tracking: Tight
Scale: Oversized

Secondary:
Style: >
  Thin sans-serif.

  Used for annotations, classification information,
  and data labels.

Weight: 300-500
Tracking: Slightly Wide

Numbers:
Style: >
  Numbers are the lead element,
  scaled boldly enough
  to span the entire page.

Weight: 800-900
Scale: Monumental

Body:
Weight: 400
LineHeight: 1.2-1.4

Layout:
Structure: >
  Adopts a strict modular grid
  to organize information systematically.

  However,
  oversized numbers and typography
  partially break the grid,
  adding an experimental quality.

Composition:
- Modular grid
- Information hierarchy
- Oversized numerals
- Typographic layering
- Structured asymmetry
- Diagrammatic layouts
- Data callouts
- Editorial whitespace

Alignment:
Preference: Grid-first
ControlledChaos: Low

Graphic Elements:
Shapes:
- Circles
- Measurement lines
- Data tables
- Timelines
- Grid systems
- Registration marks
- Rule lines
- Rectangular panels

Symbols:
- Technical notations
- Arrows
- Coordinate markers
- Crosshairs
- Scientific labels
- Diagram indicators

Decorative Rules:
- Every decorative element should imply function.
- Ornament should emerge from information systems.
- Avoid purely decorative illustrations.
- Use repetition to establish rhythm.

Imagery:
Style: >
  Photographs and figures are treated
  like academic references or archival specimens.

  Objects are cut out
  and placed as information elements equivalent to data.

Treatment:
- High contrast cutouts
- Minimal shadows
- Flat reproduction
- Technical labeling
- Archive aesthetic
- Editorial integration

Subjects:
- Scientific specimens
- Historical artifacts
- Everyday objects
- Charts and diagrams
- Educational references
- Classification systems

Background:
Style: >
  Based on a white paper surface,
  with grids and rules left exposed.

  Vivid pink,
  acid yellow,
  and cyan blue color fields
  are used as devices for classifying information.

Effects:
Texture: >-
  Smooth offset print texture
  Slight paper grain
  Archive reproduction feel

Shadow: >-
  None

Depth: >-
  Flat editorial layering

Distortion: >-
  Precise and controlled

Visual Rules:
- Use white space generously.
- Typography and data should dominate imagery.
- Use oversized numbers as anchor points.
- Restrict each slide to one dominant accent color.
- Expose the underlying grid whenever possible.
- Treat diagrams as visual storytelling devices.
- Balance precision with experimentation.
- Design for clarity at mobile viewing sizes.

Exclusions:
- Corporate presentation templates
- Photorealistic lifestyle photography
- Glassmorphism
- Heavy gradients
- Organic doodles
- Decorative serif typography
- Skeuomorphic effects
- Excessive visual clutter
- Luxury branding aesthetics
