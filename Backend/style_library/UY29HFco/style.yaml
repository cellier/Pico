Design Style:
Name: "Monochrome White"

Concept: >
  Apple、
  Braun、
  Dieter Rams、
  MUJI、
  Aesop、
  Kinfolk、
  Scandinavian Design、
  Studio Workspace、
  Product Photography、
  Flat Lay、
  design museums,
  and lifestyle editorials —
  a white, curated, flat-lay design.

  Slides are composed not as presentation material,
  but as a designer’s studio desk,
  a lifestyle magazine,
  a brand lookbook,
  a product catalog,
  or a museum display case.

  Rather than explaining information,
  the worldview is built through
  the arrangement of objects,
  whitespace,
  texture,
  and organized order.

