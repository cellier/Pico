Whitespace:
Density: Extremely High

Visual Rules:
- Maintain a flat-lay composition shot from directly above.
- Unify the palette around white.
- Keep the spacing between objects even.
- Arrange elements neatly with an awareness of the grid.
- Beautifully organize Apple products, stationery, and everyday items.
- Reserve enough whitespace so each object reads independently.
- Express dimensionality through soft natural light, not harsh shadows.
- Aim for the polish of a magazine lifestyle feature or brand lookbook.
- Reflect the "Less but Better" philosophy throughout.
- Prioritize order, quiet, and beauty over information volume.

Avoid:
- Bright colors
- Rainbow palettes
- Heavy gradients
- Neon effects
- Clip art
- Cartoon illustrations
- Decorative borders
- Busy layouts
- Random object placement
- Strong shadows

Do Not Specify:
- Titles
- Body text
- Topic
- Names
- Numbers
