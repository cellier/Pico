Design Style:
Name: "Minimal Isometric"

Concept: >
  A minimal isometric design that supports a wide range
  of business uses — corporate strategy decks, proposals,
  business plans, marketing materials, training materials,
  pitch decks, and internal reports.

  Built on oversized typography and simple geometric composition,
  combined with isometric illustrations
  that depict business scenes.

  It prioritizes information legibility above all,
  delivering presentations that feel modern, approachable,
  and persuasive.

