Content Rules:

Titles:
- Very Large
- High Contrast
- Maximum 2–4 Lines

Text:
- Prioritize Readability
- Short Paragraphs
- Strong Visual Hierarchy

Illustration Ratio:
- 30% to 45% of Slide Area

Visual Balance:
- Typography First
- Illustration Supports Content

Rules:
- Use large bold headlines
- Use yellow only as an accent color
- Keep backgrounds clean and bright
- Maintain strong contrast
- Use diagonal geometric compositions
- Avoid decorative clutter
- Use isometric illustrations consistently
- Favor whitespace over dense layouts
- Suitable for consulting, marketing, SaaS, corporate strategy, research, education, and business presentations
