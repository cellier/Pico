Design Style:
Name: "Bold Brutalist Editorial"
Concept: "A brutalist editorial presentation design combining bold color, heavy typography, grid lines, and dramatic photo crops"

Canvas:
Ratio: "16:9"

Mood:
- Bold
- Editorial
- Brutalism
- Street
- Fashion
- Modern
- Energetic
- Graphic

Color Palette:
Background:
Main: "#FFFFFF"
Cream: "#EFE9D8"
Lavender: "#D8D0F0"

Text:
Primary: "#111111"
Light: "#FFFFFF"
Highlight: "#FFF200"

Accent:
Orange: "#FF8A00"
Lime: "#58F21B"
Blue: "#263BFF"
Pink: "#F23BC8"
RedOrange: "#FF4A2E"
Yellow: "#FFF200"

Typography:
Heading:
Font: "Extra Bold Grotesk Sans"
Weight: "900"
Color: "#111111"
Style:
- "oversized bold headline"
- "condensed grotesk"
- "all caps"
- "tight letter spacing"
- "editorial poster typography"

Body:
Font: "Clean Grotesk Sans"
Weight: "500-700"
Color: "#111111"
Style:
- "compact text blocks"
- "small uppercase captions"
- "dense editorial copy"

Label:
Font: "Condensed Sans Serif"
Weight: "700-900"
Style:
- "small metadata text"
- "magazine grid label"
- "vertical label text"

Layout:
General:
- "strict editorial grid"
- "visible thin grid lines"
- "asymmetric block layout"
- "large color panels"
- "bold headline placement"
- "photo and text overlap"
- "poster-like composition"

Grid:
Columns: "4-8 column modular grid"
Rows: "3-6 row modular grid"
BorderLines: "thin black lines"
Padding: "3-5%"
Gap: "none or very tight"

Visual Elements:
Frames:
- "thin black rectangular borders"
- "modular grid boxes"
- "small metadata header bars"
- "barcode-like detail"
- "page number circles"

Photos:
Style:
- "fashion/editorial portrait photography"
- "high contrast"
- "black and white or color photo"
- "rectangular crop"
- "partial overlay with color panels"

Shapes:
- "solid color blocks"
- "large rectangular panels"
- "small black information boxes"
- "vertical title strips"

Slide Types:
Cover:
Layout:
- "oversized headline"
- "large color background"
- "portrait photo crop"
- "small metadata text"
Style:
- "bold magazine cover"
- "graphic poster design"

Portfolio Slide:
Layout:
- "large photo on one side"
- "bold title block"
- "small black caption card"
- "thin grid lines"

Guideline Slide:
Layout:
- "full color background"
- "oversized typography"
- "vertical text element"
- "grid-based information blocks"

Image Slide:
Layout:
- "two or three photo blocks"
- "bold vertical label"
- "large explanatory text block"

Activity Slide:
Layout:
- "hot pink full background"
- "large yellow title"
- "portrait image"
- "thin grid borders"

Minimalism Slide:
Layout:
- "blue full background"
- "large yellow headline"
- "rectangular photo"
- "vertical design label"

Rules:

- "Individual slide backgrounds are white or a strong accent color"
- "Always include a thin black-line grid"
- "Place bold English headlines at large scale"
- "Use highly saturated colors boldly"
- "Place photography large, fashion-magazine style"
- "Prioritize grid density and information feel over whitespace"
- "Include small metadata, labels, and numbers"
- "Aim for a slightly aggressive magazine layout rather than one that is too tidy"
- "Do not use shadows or gradients"
